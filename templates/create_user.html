{% extends "base.html" %}
{% block title %}Create New User{% endblock %}
{% block content %}
<h1>Create New User</h1>
<div class="card narrow">
  <form method="POST">
    <label>Full Name *</label>
    <input name="name" required>

    <label>Username *</label>
    <input name="username" required>

    <label>Role *</label>
    <select name="role" required onchange="toggleStudentFields()">
      <option value="">-- choose --</option>
      {% for role in roles %}
      <option value="{{ role }}">{{ role|capitalize }}</option>
      {% endfor %}
    </select>

    <div id="block-field" style="display:none;">
      <label>Block *</label>
      <input name="block">
    </div>

    <div id="room-field" style="display:none;">
      <label>Room Number *</label>
      <input name="room_no">
    </div>

    <label>Password *</label>
    <input type="password" name="password" required minlength="6">
    <small class="muted">Minimum 6 characters</small>

    <button class="btn" type="submit">Create User</button>
    <a class="btn sec" href="{{ url_for('admin_dashboard') }}">Cancel</a>
  </form>
</div>

<script>
function toggleStudentFields() {
    const role = document.querySelector('select[name="role"]').value;
    const blockField = document.getElementById('block-field');
    const roomField = document.getElementById('room-field');

    if (role === 'student') {
        blockField.style.display = 'block';
        roomField.style.display = 'block';
    } else {
        blockField.style.display = 'none';
        roomField.style.display = 'none';
    }
}
</script>
{% endblock %}
