{% extends "base.html" %}
{% block title %}New Complaint{% endblock %}
{% block content %}
<div class="card" style="max-width:640px;margin:auto">
  <h2>Submit a Complaint</h2>
  <form method="post" enctype="multipart/form-data">
    <label>Category *</label>
    <select name="category_id" required>
      <option value="">-- choose --</option>
      {% for c in cats %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
    </select>
    <label>Short title *</label><input name="title" maxlength="100" placeholder="e.g. Fan not working" required>
    <label>Description *</label><textarea name="description" placeholder="Describe the problem and its exact location" required></textarea>
    <label>Priority</label>
    <select name="priority">{% for p in priorities %}<option>{{ p }}</option>{% endfor %}</select>
    <small class="muted">Use Urgent only for water, electricity or safety problems.</small>
    <label>Photo (optional, max 3 MB)</label><input type="file" name="photo" accept="image/*">
    <button class="btn" type="submit">Submit Complaint</button>
  </form>
</div>
{% endblock %}
